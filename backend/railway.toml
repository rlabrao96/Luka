[build]
builder = "nixpacks"

[deploy]
startCommand = "sh -c 'case \"$START_COMMAND\" in worker-fast) exec python -m arq worker.FastWorkerSettings;; worker-slow) exec python -m arq worker.SlowWorkerSettings;; *) exec uvicorn main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips=* ;; esac'"
restartPolicyType = "on_failure"
releaseCommand = "alembic upgrade head"
