[project]
name = "luka-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.2.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.25.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "supabase>=2.4.0",
    "openai>=1.30.0",
    "rapidfuzz>=3.9.0",
    "tenacity>=8.3.0",
    "google-auth>=2.29.0",
    "slowapi>=0.1.9",
    "pydantic[email]>=2.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "modules*"]

[tool.ruff]
line-length = 100
target-version = "py312"
